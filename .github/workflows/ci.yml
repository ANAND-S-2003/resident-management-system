name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests, including Testcontainers integration tests
        working-directory: backend
        run: mvn -B clean verify

      - name: Upload Maven reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These throw-away values are only for the isolated CI MySQL service.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rms
          MYSQL_USER: rms_app
          MYSQL_PASSWORD: ci-only-db-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      RMS_DB_URL: 'jdbc:mysql://127.0.0.1:3306/rms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
      RMS_DB_USER: rms_app
      RMS_DB_PASSWORD: ci-only-db-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      RMS_SUPERADMIN_EMAIL: ci-superadmin@example.test
      RMS_SUPERADMIN_NAME: CI Super Admin
      RMS_SUPERADMIN_PASSWORD: CiOnlyPass123
      RMS_TIMEZONE: Asia/Kolkata
      RMS_CORS_ALLOWED_ORIGINS: http://localhost:5173
      RMS_TRUST_PROXY: 'false'
      RMS_RATE_LIMIT_REGISTER_MAX: '1000'
      RMS_RATE_LIMIT_LOGIN_MAX: '1000'
      RMS_RATE_LIMIT_CONTACT_MAX: '1000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate an ephemeral CI JWT secret
        shell: bash
        run: |
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$jwt_secret"
          echo "RMS_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Build backend executable jar
        run: mvn -B -DskipTests package
        working-directory: backend

      - name: Start backend in the background
        shell: bash
        run: |
          jar="$(find backend/target -maxdepth 1 -type f -name 'resident-management-backend-*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [ -z "$jar" ]; then
            echo "Backend executable jar was not found."
            exit 1
          fi
          nohup java -jar "$jar" > backend.log 2>&1 &
          echo "$!" > backend.pid

      - name: Wait for the backend health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            health="$(curl --silent --show-error --fail http://localhost:8080/actuator/health 2>/dev/null || true)"
            if [ "$health" = '{"status":"UP"}' ]; then
              echo "Backend health check is UP."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy before the timeout. Backend log follows:"
          cat backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and operating-system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: backend.log
          if-no-files-found: ignore
          retention-days: 7
