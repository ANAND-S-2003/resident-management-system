spring:
  application:
    name: resident-management-backend
  datasource:
    url: ${RMS_DB_URL}
    username: ${RMS_DB_USER}
    password: ${RMS_DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    throw-exception-if-no-handler-found: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
rms:
  jwt-secret: ${RMS_JWT_SECRET}
  superadmin-email: ${RMS_SUPERADMIN_EMAIL}
  superadmin-name: ${RMS_SUPERADMIN_NAME}
  superadmin-password: ${RMS_SUPERADMIN_PASSWORD}
  timezone: ${RMS_TIMEZONE:Asia/Kolkata}
  cors-allowed-origins: ${RMS_CORS_ALLOWED_ORIGINS:}
  trust-proxy: ${RMS_TRUST_PROXY:false}
  rate-limit-login-max: ${RMS_RATE_LIMIT_LOGIN_MAX:5}
  rate-limit-register-max: ${RMS_RATE_LIMIT_REGISTER_MAX:10}
  rate-limit-contact-max: ${RMS_RATE_LIMIT_CONTACT_MAX:5}

